name: Unit Tests

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'README*.md'
      - 'changelogs/**'
      - 'dashboard/**'
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    name: Run pytest suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    # The Windows lane stays best-effort for now: the suite still has
    # pre-existing Windows-specific failures there. Promote to blocking
    # once those tests are fixed.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}

    defaults:
      run:
        # Windows runners default to pwsh; use bash so the same steps and
        # test script work on all three platforms.
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

      - name: Install audio test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install FFmpeg for audio tests
        if: runner.os == 'Windows' || runner.os == 'macOS'
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            choco install ffmpeg -y --no-progress
          else
            brew install ffmpeg
          fi
          ffmpeg -version

      - name: Diagnose macOS converter address space
        if: runner.os == 'macOS'
        run: |
          for mode in default nano-off; do
            if [ "$mode" = nano-off ]; then
              export MallocNanoZone=0
            fi
            DIAG_MODE="$mode" python - <<'PY'
          import os
          import resource
          import subprocess

          requested = 512 * 1024 * 1024
          soft, hard = resource.getrlimit(resource.RLIMIT_AS)
          target = min(
              [requested]
              + [limit for limit in (soft, hard) if limit != resource.RLIM_INFINITY]
          )
          try:
              vsize_kib = subprocess.run(
                  ("ps", "-o", "vsz=", "-p", str(os.getpid())),
                  capture_output=True,
                  text=True,
                  timeout=1,
                  check=False,
              ).stdout.strip() or "unavailable"
          except Exception:
              vsize_kib = "unavailable"
          try:
              resource.setrlimit(resource.RLIMIT_AS, (target, target))
              result = "accepted"
          except (OSError, ValueError) as exc:
              result = f"{type(exc).__name__}: {exc}"
          print(
              f"{os.environ['DIAG_MODE']} RLIMIT_AS soft={soft} hard={hard} "
              f"requested={requested} target={target} vsize_kib={vsize_kib} "
              f"result={result}"
          )
          PY
          done

      - name: Run tests
        run: |
          chmod +x scripts/run_pytests_ci.sh
          bash ./scripts/run_pytests_ci.sh ./tests
